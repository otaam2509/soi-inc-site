<!DOCTYPE html>
<html lang="ja">
<head>
{{site_verification}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}">
<meta property="og:site_name" content="株式会社SOI">
<meta property="og:locale" content="ja_JP">
<meta property="og:type" content="{{og_type}}">
<meta property="og:url" content="{{url}}">
<meta property="og:title" content="{{og_title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="{{site}}/assets/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="株式会社SOI">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{og_title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="robots" content="{{robots}}">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css?v={{version}}">
<link rel="stylesheet" href="/assets/css/creative-20261103.css?v={{version}}">
<link rel="stylesheet" href="/assets/css/articles-20261103.css?v={{version}}">
<link rel="stylesheet" href="/assets/css/refine-20261103.css?v={{version}}">
<meta name="theme-color" content="#090b0d">
<!-- Google Analytics(GA4・info@soi-co-ltd.com のアカウント) -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ga_id}}"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','{{ga_id}}');</script>
{{jsonld}}
</head>
<body class="{{body_class}}">
<a class="skip" href="#main">本文へ移動</a>
<nav aria-label="メインメニュー"><div class="wrap">
  <a class="logo" href="/" aria-label="株式会社SOI トップへ">SOI<small>株式会社SOI</small></a>
  <div class="links"><span class="menu">{{nav}}</span><a class="btn" href="#contact">相談する <span aria-hidden="true">↗</span></a><button class="soi-menu-toggle" type="button" aria-controls="soi-mobile-menu" aria-expanded="false" aria-label="メニューを開く"><span></span><span></span></button></div>
</div>
<div class="subnav" id="soi-mobile-menu" hidden>{{nav}}</div></nav>

<main id="main">
{{content}}

<section id="contact" class="cta-band"><div class="wrap">
  <div class="kicker"><span class="en">Contact</span>お問い合わせ</div>
  <h2>{{contact_heading}}</h2>
  <p>{{contact_text}}</p>
  <div class="ctas">{{contact_actions}}</div>
  <span class="mail">{{contact_note}}</span>
</div></section>
</main>

<footer><div class="wrap">
  <div><img class="flogo" src="/assets/logo.png" alt="SOI CO.,LTD" width="330" height="190" loading="lazy"></div>
  <div class="fmeta">
    <div class="fnav" role="navigation" aria-label="フッターメニュー">{{footnav}}</div>
    <span>株式会社SOI　〒142-0041 東京都品川区戸越5-18-16-2F</span>
    <span class="legal"><a href="/privacy/">プライバシーポリシー</a></span>
    <span class="copy">© SOI CO.,LTD</span>
  </div>
</div></footer>
<script src="/assets/js/site.js?v={{version}}" defer></script>
<script src="/assets/js/measurement.js?v={{version}}" defer></script>
<script src="/assets/js/creative-20261103.js?v={{version}}" defer></script>
</body>
</html>
